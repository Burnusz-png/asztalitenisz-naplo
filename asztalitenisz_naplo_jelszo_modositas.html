function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function toast(t){var e=document.getElementById('toast');e.textContent=t;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},2600)}

/* ---------- adattárolás ---------- */
var store=loadStore();

function newJ(name){return {id:uid(),name:name,updated:0,exported:0,matches:[],rounds:{}}}
function normJ(j){return {id:j.id||uid(),name:norm(j.name)||'Napló',updated:j.updated||0,exported:j.exported||0,matches:(j.matches||[]).map(normMatch),rounds:(j.rounds&&typeof j.rounds==='object'&&!Array.isArray(j.rounds))?j.rounds:{}}}
function wrapStore(o){
  if(!o||typeof o!=='object')return null;
  if(Array.isArray(o.journals)&&o.journals.length){var js=o.journals.map(normJ);var cur=js.some(function(x){return x.id===o.cur})?o.cur:js[0].id;return {v:2,cur:cur,u:o.u||0,journals:js}}
  if(Array.isArray(o.matches)){var j=normJ(o);if(!norm(o.name))j.name='Napló 1';return {v:2,cur:j.id,u:0,journals:[j]}}

}
function stamp(st){var m=st.u||0;st.journals.forEach(function(j){if(j.updated>m)m=j.updated});return m}
function loadStore(){
  var loc=null,seed=null;
  try{loc=wrapStore(JSON.parse(localStorage.getItem(KEY)))}catch(e){}

  return c[0];

/* ---------- számítások ---------- */
function mstat(m){
  var f=(m.sets||[]).filter(function(s){return s&&(s.w!=null||s.l!=null)});
  var sw=null,sl=null,pw=null,pl=null,n=null,res=null;
  if(f.length){pw=0;pl=0;sw=0;sl=0;f.forEach(function(s){var w=s.w||0,l=s.l||0;pw+=w;pl+=l;if(w>l)sw++;else if(l>w)sl++});n=f.length}
  else{
    if(m.msw!=null&&m.msl!=null){sw=m.msw;sl=m.msl;n=sw+sl}
    if(m.mpw!=null&&m.mpl!=null){pw=m.mpw;pl=m.mpl}
  }
  if(m.mres==='W'||m.mres==='L')res=m.mres;
  else if(sw!=null&&sl!=null&&sw!==sl)res=sw>sl?'W':'L';
  return {sw:sw,sl:sl,pw:pw,pl:pl,n:n,res:res,sets:f};
}
function agg(list){
  var a={m:list.length,w:0,l:0,swT:0,slT:0,swN:0,pwT:0,plT:0,pN:0,ppW:0,ppL:0,ppN:0};
  list.forEach(function(m){
    var s=mstat(m);
    if(s.res==='W')a.w++;else if(s.res==='L')a.l++;
    if(s.sw!=null){a.swT+=s.sw;a.slT+=s.sl;a.swN++}
    if(s.pw!=null){a.pwT+=s.pw;a.plT+=s.pl;a.pN++;if(s.n!=null){a.ppW+=s.pw;a.ppL+=s.pl;a.ppN+=s.n}}
  });
  a.winPct=(a.w+a.l)?a.w/(a.w+a.l)*100:null;
  a.avgPw=a.pN?a.pwT/a.pN:null;a.avgPl=a.pN?a.plT/a.pN:null;
  a.avgSw=a.swN?a.swT/a.swN:null;a.avgSl=a.swN?a.slT/a.swN:null;
  a.sdPct=(a.swT+a.slT)?(a.swT-a.slT)/(a.swT+a.slT)*100:null;
  a.dPct=(a.pwT+a.plT)?(a.pwT-a.plT)/(a.pwT+a.plT)*100:null;
  a.ppsW=a.ppN?a.ppW/a.ppN:null;a.ppsL=a.ppN?a.ppL/a.ppN:null;
  return a;
}
function players(){

function warnStore(){return '<div class="warnbox">⚠ Ebben a megnyitási módban a böngésző nem tárolja tartósan az adatokat, ezért bezárás vagy újratöltés után eltűnhetnek. Mentsd őket gyakran (Adatok fül → Excel vagy JSON), és később a mentett fájlt nyisd meg.</div>'}
var S={view:'over',editId:null,player:null,q:'',fp:'',ft:'',fo:'',fr:'',mv:lsGet('ttnaplo_mv')==='cards'?'cards':'table'};

function resetUi(){S.view='over';S.player=null;S.editId=null;S.q='';S.fp='';S.ft='';S.fo='';S.fr=''}
function switchJ(id){store.cur=id;db=curJ();persist();resetUi();render()}
function addJ(name){var j=newJ(name);store.journals.push(j);store.u=Date.now();switchJ(j.id);toast('Új napló létrehozva: '+name)}
function newJFlow(){var n=askJName(uniqName('Napló '+(store.journals.length+1)),null);if(n===null){render();return}addJ(n)}
function renJ(id){
  var j=store.journals.filter(function(x){return x.id===id})[0];if(!j)return;
  var n=askJName(j.name,id);if(n===null)return;
  j.name=n;store.u=Date.now();persist();toast('Átnevezve');render();
}
function delJ(id){
  var j=store.journals.filter(function(x){return x.id===id})[0];if(!j)return;
  if(store.journals.length<2){toast('Az utolsó naplót nem lehet törölni');return}
  if(!confirm('Biztosan törlöd a(z) „'+j.name+'” naplót és a benne lévő '+j.matches.length+' mérkőzést? Előbb érdemes Excelbe menteni.'))return;
  store.journals=store.journals.filter(function(x){return x.id!==id});
  store.u=Date.now();
  if(store.cur===id){store.cur=store.journals[0].id;db=curJ();resetUi()}
  persist();toast('Napló törölve');render();
}
function jsel(){return '<select id="jsel" aria-label="Napló kiválasztása">'+store.journals.map(function(j){return '<option value="'+esc(j.id)+'"'+(j.id===store.cur?' selected':'')+'>'+esc(j.name)+'</option>'}).join('')+'<option value="__new">➕ Új napló hozzáadása…</option></select>'}

/* ---------- megjelenítés ---------- */
function nav(){
  var t=[['over','📊','Áttekintés'],['matches','🏓','Mérkőzések'],['players','👥','Játékosok'],['form','➕','Új'],['data','💾','Adatok']];
  return '<nav>'+t.map(function(x){return '<button data-act="nav" data-v="'+x[0]+'" class="'+(S.view===x[0]?'on':'')+'"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('')+'<button data-act="logout" type="button"><span>🚪</span>Kilépés</button></nav>';
}
function render(){
  if(!activeUser){renderLogin();return;}
  var body='';
  if(S.view==='over')body=vOver();
  else if(S.view==='matches')body=vMatches();
  else if(S.view==='players')body=S.player?vPlayer():vPlayers();
  else if(S.view==='form')body=vForm();
  else body=vData();
  document.getElementById('app').innerHTML='<header><span class="ttl">🏓 Asztalitenisz napló</span>'+jsel()+'<button class="b sec sm" data-act="logout" type="button">Kilépés ('+esc(activeUsername)+')</button></header><main>'+body+'</main>'+nav();
  if(S.view==='form')bindForm();
  window.scrollTo(0,0);
}
function exTxt(base,v1,v2,per,unit){
  var t=base;
  if(v1!=null&&v2!=null)t+=' A kártyán látható '+f1(v1)+' : '+f1(v2)+' azt jelenti: '+per+' átlagosan '+f1(v1)+' nyert és '+f1(v2)+' vesztett '+unit+'.';
  return t;
}
function statCards(a,home){
  var c=[[a.m,'Mérkőzés'],[a.w+' – '+a.l,'Győzelem – vereség'],[a.winPct==null?'–':Math.round(a.winPct)+'%','Győzelmi arány'],
    [f1(a.avgPw)+' : '+f1(a.avgPl),'Átl. pont / mérkőzés (nyert : vesztett)',exTxt('Egy mérkőzésen átlagosan nyert, illetve vesztett pontok száma (az összes pont osztva a mérkőzések számával).',a.pN?a.avgPw:null,a.pN?a.avgPl:null,'mérkőzésenként','pont')],[f1(a.ppsW)+' : '+f1(a.ppsL),'Átl. pont / szett (nyert : vesztett)',exTxt('Egy szettben átlagosan nyert, illetve vesztett pontok száma.',a.ppsW,a.ppsL,'szettenként','pont')],[f1(a.avgSw)+' : '+f1(a.avgSl),'Átl. szett / mérkőzés (nyert : vesztett)',exTxt('Egy mérkőzésen átlagosan nyert, illetve vesztett szettek száma.',a.swN?a.avgSw:null,a.swN?a.avgSl:null,'mérkőzésenként','szett')],[a.pN?dtxt(a.pwT,a.plT):'–','Összes pontkülönbség (nyert − vesztett, %)'],[a.pN?sg(Math.round((a.avgPw-a.avgPl)*10)/10).toString().replace('.',','):'–','Átl. pontkülönbség / mérkőzés'],[a.swN?dtxt(a.swT,a.slT):'–','Összes szettkülönbség (nyert − vesztett, %)'],[a.swN?sg(Math.round((a.avgSw-a.avgSl)*10)/10).toString().replace('.',','):'–','Átl. szettkülönbség / mérkőzés']];
  if(home)c=c.filter(function(x){return x[1]!=='Átl. szettkülönbség / mérkőzés'});
  return '<div class="stats">'+c.map(function(x){return '<div class="st"'+(x[2]?' tabindex="0"':'')+'><b>'+x[0]+'</b><span>'+x[1]+(x[2]?' <i class="inf">ⓘ</i>':'')+'</span>'+(x[2]?'<em class="ex" role="tooltip">'+x[2]+'</em>':'')+'</div>'}).join('')+'</div>';
}
function dirtyBanner(){
  if(db.matches.length&&db.updated>db.exported)
    return '<div class="warnbox">⚠ Az utolsó mentés (Excel/HTML/JSON) óta módosítottál adatokat. Mentsd el, hogy ne vesszenek el. <div class="row" style="margin-top:8px"><button class="b sm" data-act="xlsx">Mentés Excelbe</button></div></div>';
  return '';
}
function vOver(){
  if(!db.matches.length)return '<h2>Áttekintés</h2><div class="card empty">Még nincs rögzített mérkőzés.<br><br><button class="b" data-act="nav" data-v="form">➕ Első mérkőzés felvétele</button><br><br><span class="hint">Ha van korábbi mentésed (Excel vagy JSON), töltsd vissza az „Adatok” fülön.</span></div>';
  var a=agg(db.matches),ps=players();
  var top=ps.slice().sort(function(x,y){return y.list.length-x.list.length}).slice(0,8);
  var h='<h2>Áttekintés</h2>'+dirtyBanner()+statCards(a,true);
  h+='<h3>Játékosok ('+ps.length+')</h3><div class="tw"><table><tr><th>Játékos</th><th>Mérk.</th><th>Gy–V</th><th>Átl. nyert pont</th><th>Átl. vesztett pont</th></tr>';
  top.forEach(function(p){h+='<tr class="clk" data-act="player" data-k="'+esc(p.key)+'"><td>'+esc(p.name)+(p.club?' <span class="sub">('+esc(p.club)+')</span>':'')+'</td><td>'+p.a.m+'</td><td>'+p.a.w+'–'+p.a.l+'</td><td>'+f1(p.a.avgPw)+'</td><td>'+f1(p.a.avgPl)+'</td></tr>'});
  h+='</table></div><h3>Legutóbbi mérkőzések</h3><div class="matches">'+sortedMatches(db.matches).slice(0,5).map(function(m){return matchCard(m,false)}).join('')+'</div>';
  return h;
}
function matchCard(m,acts){
  var s=mstat(m);
  var badge=s.res==='W'?'<span class="badge W">Győzelem</span>':s.res==='L'?'<span class="badge L">Vereség</span>':'<span class="badge N">–</span>';
  var sets=s.sets.map(function(x){return (x.w||0)+':'+(x.l||0)}).join('  ·  ');
  var info=[];
  if(s.sw!=null)info.push('Szettek '+s.sw+':'+s.sl+' · különbség '+dtxt(s.sw,s.sl));
  if(s.pw!=null)info.push('Pontok '+s.pw+':'+s.pl+' · különbség '+dtxt(s.pw,s.pl));
  var vs=[m.oppPlayer,m.oppTeam].filter(Boolean).join(' · ');
  var h='<div class="card match"><div class="mh"><div><b>'+esc(m.player)+'</b>'+(m.club?' <span class="sub">('+esc(m.club)+')</span>':'')+'</div>'+badge+'</div>';
  if(vs)h+='<div class="sub">ellen: '+esc(vs)+'</div>';
  var dl=[rkey(m)!=null?rlabel(rkey(m)):'',fmtDt(m.dt)].filter(Boolean).join(' · ');if(dl)h+='<div class="sub">'+dl+'</div>';
  if(sets)h+='<div class="sets">'+sets+'</div>';
  if(info.length)h+='<div class="sub">'+info.join(' · ')+'</div>';
  if(m.note)h+='<div class="sub">📝 '+esc(m.note)+'</div>';
  if(acts!==false)h+='<div class="act"><button class="b sec sm" data-act="edit" data-id="'+m.id+'">✏️ Szerkesztés</button><button class="b red sm" data-act="del" data-id="'+m.id+'">🗑 Törlés</button></div>';
  return h+'</div>';
}
function vMatches(){
  var ps=players(),teams={},opps={};
  db.matches.forEach(function(m){if(m.oppTeam)teams[m.oppTeam]=1;if(m.oppPlayer&&!opps[pkey(m.oppPlayer)])opps[pkey(m.oppPlayer)]=m.oppPlayer});
  var q=S.q.toLowerCase();
  var list=sortedMatches(db.matches).filter(function(m){
    if(S.fp&&pkey(m.player)!==S.fp)return false;
    if(S.ft&&m.oppTeam!==S.ft)return false;
    if(S.fo&&pkey(m.oppPlayer)!==S.fo)return false;
    if(S.fr&&rkey(m)!==S.fr)return false;
    if(q&&(m.player+' '+m.club+' '+m.oppTeam+' '+m.oppPlayer+' '+m.note).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var h='<h2>Mérkőzések ('+list.length+')</h2><div class="filters"><input type="search" id="q" placeholder="Keresés…" value="'+esc(S.q)+'">';
  h+='<select id="fp"><option value="">Minden játékos</option>'+ps.map(function(p){return '<option value="'+esc(p.key)+'"'+(S.fp===p.key?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select>';
  h+='<select id="ft"><option value="">Minden ellenfél csapat</option>'+Object.keys(teams).sort().map(function(t){return '<option value="'+esc(t)+'"'+(S.ft===t?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select>';
  h+='<select id="fo"><option value="">Minden ellenfél játékos</option>'+Object.keys(opps).sort(function(a,b){return opps[a].localeCompare(opps[b],'hu')}).map(function(k){return '<option value="'+esc(k)+'"'+(S.fo===k?' selected':'')+'>'+esc(opps[k])+'</option>'}).join('')+'</select>';
  var rset={};db.matches.forEach(function(m){var k=rkey(m);if(k!=null)rset[k]=1});
  h+='<select id="fr"><option value="">Minden forduló</option>'+Object.keys(rset).sort(rsort).map(function(r){return '<option value="'+r+'"'+(S.fr===r?' selected':'')+'>'+esc(rlabel(r))+'</option>'}).join('')+'</select></div>';
  h+='<div class="seg"><button data-act="mv" data-v="table" class="'+(S.mv==='table'?'on':'')+'">▦ Táblázat</button><button data-act="mv" data-v="cards" class="'+(S.mv==='cards'?'on':'')+'">▤ Kártyák</button></div>';
  if(!list.length)return h+'<div class="card empty">Nincs megjeleníthető mérkőzés.</div>';
  if(S.mv==='table')return h+matchTable(list);
  return h+'<div class="matches">'+list.map(function(m){return matchCard(m)}).join('')+'</div>';
}
function matchTable(list){
  var h='<div class="tw"><table class="cmp mt"><tr class="mh0"><th></th><th>Időpont · forduló</th><th class="tl">Játékos</th><th class="tl">Ellenfél</th><th>Szettek</th><th>Szett</th><th>Pont</th><th>Eredmény</th></tr>';
  list.forEach(function(m){
    var s=mstat(m);
    var sets=m.sets.map(function(x){
      if(x.w==null&&x.l==null)return '';
      var w=x.w||0,l=x.l||0;return '<span class="'+(w>l?'sw':l>w?'sl':'')+'">'+w+':'+l+'</span>';
    }).filter(Boolean).join(' ');
    var o1=m.oppPlayer||m.oppTeam,o2=m.oppPlayer?m.oppTeam:'';
    h+='<tr>';
    h+='<td class="ac"><button class="b sec sm ib" data-act="edit" data-id="'+m.id+'" title="Szerkesztés">✏️ <span class="bt">Szerkesztés</span></button><button class="b red sm ib" data-act="del" data-id="'+m.id+'" title="Törlés">🗑 <span class="bt">Törlés</span></button></td>';
    h+='<td data-l="Időpont">'+fmtDt(m.dt)+(rkey(m)!=null?'<br><span class="sub">'+esc(rlabel(rkey(m)))+'</span>':'')+'</td>';
    h+='<td class="tl" data-l="Játékos"><b>'+esc(m.player)+'</b>'+(m.club?'<br><span class="sub">'+esc(m.club)+'</span>':'')+'</td>';
    h+='<td class="tl" data-l="Ellenfél">'+esc(o1)+(o2?'<br><span class="sub">'+esc(o2)+'</span>':'')+'</td>';
    h+='<td data-l="Szettek">'+sets+'</td>';
    h+='<td data-l="Szett">'+(s.sw!=null?s.sw+':'+s.sl+'<br><span class="sub">'+ptxt(s.sw,s.sl)+'</span>':'')+'</td>';
    h+='<td data-l="Pont">'+(s.pw!=null?s.pw+':'+s.pl+'<br><span class="sub">'+ptxt(s.pw,s.pl)+'</span>':'')+'</td>';
    h+='<td data-l="Eredmény">'+(s.res==='W'?'<span class="badge W">Győzelem</span>':s.res==='L'?'<span class="badge L">Vereség</span>':'')+'</td></tr>';
  });
  var a=agg(list);
  h+='<tr class="ft"><td class="ac"></td><td colspan="4" class="tl lab">Átlag / mérkőzés ('+a.m+' db)</td>';
  h+='<td data-l="Szett">'+(a.swN?f1(a.avgSw)+':'+f1(a.avgSl)+'<br><span class="sub">'+ptxt(a.swT,a.slT)+'</span>':'')+'</td>';
  h+='<td data-l="Pont">'+(a.pN?f1(a.avgPw)+':'+f1(a.avgPl)+'<br><span class="sub">'+ptxt(a.pwT,a.plT)+'</span>':'')+'</td>';
  h+='<td data-l="Győzelem–vereség">'+a.w+'–'+a.l+'</td></tr>';
  return h+'</table></div><p class="hint">Az utolsó sor az átlag mérkőzésenként; a szett- és pontkülönbség (nyert − vesztett, százalékban az összes arányában) az eredmény alatt látható, az utolsó sorban az összes szettre és pontra számolva.</p>';
}
function vPlayers(){
  var ps=players();
  if(!ps.length)return '<h2>Játékosok</h2><div class="card empty">Még nincs játékos. Vegyél fel egy mérkőzést.</div>';
  var h='<h2>Játékosok ('+ps.length+')</h2><p class="hint">Koppints egy játékosra a részletekért és a javításhoz.</p><div class="tw"><table class="cmp"><tr><th>Játékos</th><th>Mérk.</th><th>Gy–V</th><th>Gy%</th><th>Átl. nyert pont / mérk.</th><th>Átl. vesztett pont / mérk.</th><th>Átl. pont / szett (ny : v)</th><th>Pontkülönbség (%)</th><th>Szettkülönbség (%)</th><th>Átl. nyert szett / mérk.</th></tr>';
  ps.forEach(function(p){var a=p.a;h+='<tr class="clk" data-act="player" data-k="'+esc(p.key)+'"><td>'+esc(p.name)+(p.club?'<br><span class="sub">'+esc(p.club)+'</span>':'')+'</td><td>'+a.m+'</td><td>'+a.w+'–'+a.l+'</td><td>'+(a.winPct==null?'–':Math.round(a.winPct)+'%')+'</td><td>'+f1(a.avgPw)+'</td><td>'+f1(a.avgPl)+'</td><td>'+f1(a.ppsW)+' : '+f1(a.ppsL)+'</td><td>'+(a.pN?dtxt(a.pwT,a.plT):'–')+'</td><td>'+(a.swN?dtxt(a.swT,a.slT):'–')+'</td><td>'+f1(a.avgSw)+'</td></tr>'});
  return h+'</table></div>';
}
function vPlayer(){
  var p=players().filter(function(x){return x.key===S.player})[0];
  if(!p){S.player=null;return vPlayers()}
  var h='<div class="row" style="margin-bottom:6px"><button class="b sec sm" data-act="back">← Vissza</button><button class="b sec sm" data-act="rename">✏️ Név / egyesület javítása</button></div>';
  h+='<h2>'+esc(p.name)+(p.club?' <span class="sub">('+esc(p.club)+')</span>':'')+'</h2>'+statCards(p.a);
  h+='<h3>Mérkőzései</h3><div class="matches">'+sortedMatches(p.list).map(function(m){return matchCard(m)}).join('')+'</div>';
  return h;
}
function vForm(){
  var m=S.editId?db.matches.filter(function(x){return x.id===S.editId})[0]:null;
  if(S.editId&&!m)S.editId=null;
  m=m||normMatch({dt:nowLocal()});
  var ps=players(),clubs={},teams={},opp={};
  db.matches.forEach(function(x){if(x.club)clubs[x.club]=1;if(x.oppTeam)teams[x.oppTeam]=1;if(x.oppPlayer)opp[x.oppPlayer]=1});
  function dl(id,o){return '<datalist id="'+id+'">'+Object.keys(o).sort().map(function(k){return '<option value="'+esc(k)+'">'}).join('')+'</datalist>'}
  function V(x){return x==null?'':x}
  var h='<h2>'+(S.editId?'Mérkőzés szerkesztése':'Új mérkőzés')+'</h2><form id="f" class="card" autocomplete="off">';
  h+='<label class="f">Játékos neve *<input name="player" list="dlP" required value="'+esc(m.player)+'" placeholder="pl. Kovács Péter"></label>';
  h+='<label class="f">Játékos egyesülete<input name="club" list="dlC" value="'+esc(m.club)+'" placeholder="pl. Budapesti SC"></label>';
  h+='<label class="f">Ellenfél játékosa (nem kötelező)<input name="oppPlayer" list="dlO" value="'+esc(m.oppPlayer)+'"></label>';
  h+='<label class="f">Ellenfél csapata<input name="oppTeam" list="dlT" value="'+esc(m.oppTeam)+'"></label>';
  h+='<label class="f">Ág</label><div class="rs">'+[['','Főág'],['V','Vigaszág']].map(function(o){return '<label><input type="radio" name="branch" value="'+o[0]+'"'+((m.branch||'')===o[0]?' checked':'')+'><span>'+o[1]+'</span></label>'}).join('')+'</div>';
  h+='<label class="f">Forduló (hányadik)<input type="number" inputmode="numeric" min="1" max="99" name="round" value="'+V(m.round)+'" placeholder="pl. 3 (vigaszágnál is megadhatod)"></label>';
  h+='<label class="f">Időpont<input type="datetime-local" name="dt" value="'+esc(m.dt)+'"></label>';
  h+='<h3>Szettek (legfeljebb 5) – nyert : vesztett pont</h3>';
  for(var i=1;i<=5;i++){var s=m.sets[i-1];h+='<div class="setrow"><span>'+i+'. szett</span><input type="number" inputmode="numeric" min="0" max="99" name="w'+i+'" placeholder="nyert" value="'+V(s.w)+'"><b>:</b><input type="number" inputmode="numeric" min="0" max="99" name="l'+i+'" placeholder="vesztett" value="'+V(s.l)+'"><div class="si" id="si'+i+'"></div></div>'}
  h+='<label class="f" style="margin-top:14px">Eredmény</label><div class="rs">'+[['','Automatikus',''],['W','Győzelem','w'],['L','Vereség','l']].map(function(o){return '<label class="'+o[2]+'"><input type="radio" name="mres" value="'+o[0]+'"'+((m.mres||'')===o[0]?' checked':'')+'><span>'+o[1]+'</span></label>'}).join('')+'</div><p class="hint">Automatikus: a program a szettekből állapítja meg (több nyert szett = győzelem). Ha kiválasztod a győzelmet vagy a vereséget, az mindig ezt az eredményt jelenti, szettek nélkül is.</p>';
  var open=(m.msw!=null||m.msl!=null||m.mpw!=null||m.mpl!=null)?' open':'';
  h+='<details'+open+'><summary>Nincs szettenkénti eredmény? Összesített adatok</summary><p class="hint">Csak akkor számít, ha a fenti szettek üresek. Páronként töltsd ki (nyert és vesztett), a többit üresen hagyhatod – az átlagot így is számolja.</p>';
  h+='<div class="row"><label class="f" style="flex:1">Nyert szett<input type="number" inputmode="numeric" min="0" name="msw" value="'+V(m.msw)+'"></label><label class="f" style="flex:1">Vesztett szett<input type="number" inputmode="numeric" min="0" name="msl" value="'+V(m.msl)+'"></label></div>';
  h+='<div class="row"><label class="f" style="flex:1">Nyert pont összesen<input type="number" inputmode="numeric" min="0" name="mpw" value="'+V(m.mpw)+'"></label><label class="f" style="flex:1">Vesztett pont összesen<input type="number" inputmode="numeric" min="0" name="mpl" value="'+V(m.mpl)+'"></label></div>';
  h+='</details>';
  h+='<label class="f">Megjegyzés<textarea name="note">'+esc(m.note)+'</textarea></label>';
  h+='<div class="live" id="live"></div>';
  h+='<div class="row" style="margin-top:12px"><button class="b" type="submit" data-after="list">💾 Mentés</button>'+(S.editId?'':'<button class="b sec" type="submit" data-after="new">Mentés és új</button>')+'<button class="b sec" type="button" data-act="cancel">Mégse</button></div>';
  h+=dl('dlP',(function(){var o={};ps.forEach(function(p){o[p.name]=1});return o})())+dl('dlC',clubs)+dl('dlT',teams)+dl('dlO',opp)+'</form>';
  return h;
}
function collect(){
  var f=document.getElementById('f'),g=function(n){return f.elements[n].value};
  var sets=[];for(var i=1;i<=5;i++)sets.push({w:num(g('w'+i)),l:num(g('l'+i))});
  return {player:norm(g('player')),club:norm(g('club')),oppTeam:norm(g('oppTeam')),oppPlayer:norm(g('oppPlayer')),dt:g('dt'),round:num(g('round')),branch:g('branch')==='V'?'V':'',note:g('note').trim(),sets:sets,
    msw:num(g('msw')),msl:num(g('msl')),mpw:num(g('mpw')),mpl:num(g('mpl')),mres:g('mres')};
}
function validSet(w,l){var mx=Math.max(w,l),d=Math.abs(w-l);return (mx===11&&d>=2)||(mx>11&&d===2)}
function live(){
  var m=collect(),s=mstat(m);
  for(var i=0;i<5;i++){
    var e=document.getElementById('si'+(i+1)),x=m.sets[i],t='',w=false;
    if(x.w!=null&&x.l!=null){
      t=x.w>x.l?'✔ nyert szett':x.l>x.w?'✖ vesztett szett':'döntetlen?';
      if(!validSet(x.w,x.l)){t+=' · ⚠ szokatlan eredmény (ellenőrizd)';w=true}
    }else if(x.w!=null||x.l!=null){t='⚠ mindkét érték kell (0 is lehet)';w=true}
    e.textContent=t;e.className='si'+(w?' warn':'');
  }
  var p=[];
  if(s.sw!=null)p.push('Szettek '+s.sw+':'+s.sl);
  if(s.pw!=null)p.push('Pontok '+s.pw+':'+s.pl);
  if(s.res)p.push(s.res==='W'?'Győzelem':'Vereség');
  document.getElementById('live').textContent=p.length?p.join(' · '):'Összegzés: add meg a szettek pontjait (vagy az összesített adatokat).';
}
function bindForm(){
  var f=document.getElementById('f');
  f.addEventListener('input',live);
  f.elements.player.addEventListener('change',function(){
    var k=pkey(this.value);if(!k||f.elements.club.value)return;
    var p=players().filter(function(x){return x.key===k})[0];if(p&&p.club)f.elements.club.value=p.club;
  });
  var btns=f.querySelectorAll('button[type=submit]');
  for(var i=0;i<btns.length;i++)btns[i].addEventListener('click',function(){f.dataset.after=this.getAttribute('data-after')});
  live();
}
function submitForm(){
  var f=document.getElementById('f'),m=collect();
  if(!m.player){toast('A játékos neve kötelező');return}
  for(var i=0;i<5;i++){var s=m.sets[i];if((s.w==null)!==(s.l==null)){toast((i+1)+'. szett: mindkét értéket add meg (0 is lehet)');return}}
  var after=f.dataset.after||'list';
  if(S.editId){
    for(var j=0;j<db.matches.length;j++)if(db.matches[j].id===S.editId){m.id=S.editId;db.matches[j]=normMatch(m)}
    toast('Módosítva');
  }else{m.id=uid();db.matches.push(normMatch(m));toast('Mérkőzés mentve')}
  changed();S.editId=null;
  if(after==='new'){S.view='form'}else{S.view='matches'}
  render();
}

var crcT=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
  var enc=new TextEncoder(),chunks=[],cd=[],off=0;
  var d=new Date(),dtm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),ddt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(function(f){
    var nm=enc.encode(f.name),data=f.data,crc=crc32(data);
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dtm,true);lh.setUint16(12,ddt,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer),nm,data);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dtm,true);ch.setUint16(14,ddt,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+data.length;
  });
  var cdSize=0;cd.forEach(function(c){cdSize+=c.length});
  var e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  var all=chunks.concat(cd,[new Uint8Array(e.buffer)]),tot=0;all.forEach(function(c){tot+=c.length});
  var out=new Uint8Array(tot),p=0;all.forEach(function(c){out.set(c,p);p+=c.length});return out;
}
function colName(i){var s='';i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}

function sheetXml(rows,widths,sst){

  var x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:'+colName(nc-1)+Math.max(rows.length,1)+'"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>';

    r.forEach(function(v,ci){

      var ref=colName(ci)+(ri+1),st=ri===0?' s="1"':'';

function r2(n){return n==null?null:Math.round(n*100)/100}
function roundInfo(){
  var R={};
  db.matches.forEach(function(m){
    var rk=rkey(m);if(rk==null)return;
    var r=R[rk]||(R[rk]={key:rk,n:rcell(rk),auto:0,pl:{},all:[]});
    r.auto++;r.all.push(m);
    var k=pkey(m.player);if(!k)return;
    var e=r.pl[k]||(r.pl[k]={name:m.player,list:[]});e.list.push(m);
  });
  return Object.keys(R).sort(rsort).map(function(k){
    var r=R[k],v=db.rounds&&db.rounds[k];r.total=(v!=null&&v!=='')?v:r.auto;return r;
  });
}
function wl(list){var w=0,l=0;list.forEach(function(m){var x=mstat(m).res;if(x==='W')w++;else if(x==='L')l++});return [w,l]}

  }
  if(ev.target.id==='createUserForm'){

  }
  else if(a==='rename'){
    var p=players().filter(function(x){return x.key===S.player})[0];if(!p)return;
    var nn=prompt('Játékos neve:',p.name);if(nn===null)return;nn=norm(nn);if(!nn){toast('A név nem lehet üres');return}
    var cc=prompt('Egyesület (üresen hagyható):',p.club||'');if(cc===null)return;cc=norm(cc);
    db.matches.forEach(function(m){if(pkey(m.player)===p.key){m.player=nn;m.club=cc}});
    S.player=pkey(nn);changed();toast('Javítva az összes mérkőzésnél');render();
  }
  else if(a==='jnew'){newJFlow()}
  else if(a==='jopen'){switchJ(t.getAttribute('data-id'))}
  else if(a==='jren'){renJ(t.getAttribute('data-id'))}
  else if(a==='jdel'){delJ(t.getAttribute('data-id'))}
  else if(a==='xlsx'){
    exportXlsx();
  }
  else if(a==='html'){saveHtml()}
  else if(a==='json'){doSave(fname('json'),new Blob([JSON.stringify(db,null,1)],{type:'application/json'}),'application/json','JSON fájl','JSON')}
  else if(a==='mv'){S.mv=t.getAttribute('data-v');lsSet('ttnaplo_mv',S.mv);render()}
  else if(a==='wipe'){
    if(confirm('Biztosan törlöd a(z) „'+db.name+'” napló ÖSSZES mérkőzését? Előbb érdemes Excelbe menteni.')&&confirm('Végleges törlés. Biztos vagy benne?')){db.matches=[];db.rounds={};changed();toast('A napló mérkőzései törölve');render()}
  }
});
document.addEventListener('submit',function(ev){if(ev.target.id==='f'){ev.preventDefault();submitForm()}});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='jsel'){if(t.value==='__new')newJFlow();else if(t.value!==store.cur)switchJ(t.value)}
  else if(t.name==='sm'){lsSet('ttnaplo_sm',t.value);toast('Mentési hely beállítva')}
  else if(t.getAttribute&&t.getAttribute('data-rnd')){var rn=t.getAttribute('data-rnd'),rv=num(t.value);if(rv==null)delete db.rounds[rn];else db.rounds[rn]=rv;changed();toast('Mentve')}
  else if(t.getAttribute&&t.getAttribute('data-imp')){var f=t.files[0];if(f)importFile(f,t.getAttribute('data-imp'));t.value=''}
  else if(t.id==='fp'){S.fp=t.value;render()}
  else if(t.id==='ft'){S.ft=t.value;render()}
  else if(t.id==='fo'){S.fo=t.value;render()}
  else if(t.id==='fr'){S.fr=t.value;render()}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){
    S.q=ev.target.value;var pos=ev.target.selectionStart;render();
    var q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}
  }
});

initializeAuth().catch(function(e){document.getElementById('app').innerHTML='<main><div class="card">A Supabase kapcsolat indítása nem sikerült: '+esc(e.message||'Ismeretlen hiba')+'</div></main>'});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script></body></html>
